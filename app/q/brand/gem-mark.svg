<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 58 58" role="img" aria-label="Gem Agency">
  <!-- Gem Agency mark: a brilliant-cut amethyst in side profile.
       Six facets, lit from the upper left, so it still reads as a gem at 16px.
       Crown: table + two bezels. Pavilion: three facets meeting at the culet. -->
  <defs>
    <linearGradient id="gm-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDD4FF"/>
    </linearGradient>
    <linearGradient id="gm-crown-l" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4CAFF"/><stop offset="1" stop-color="#9F8FFF"/>
    </linearGradient>
    <linearGradient id="gm-crown-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9C8DFF"/><stop offset="1" stop-color="#6A58F4"/>
    </linearGradient>
    <linearGradient id="gm-pav-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E7DFF"/><stop offset="1" stop-color="#5642DC"/>
    </linearGradient>
    <linearGradient id="gm-pav-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D0C3FF"/><stop offset=".55" stop-color="#A585FB"/><stop offset="1" stop-color="#D86CF0"/>
    </linearGradient>
    <linearGradient id="gm-pav-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F4DE8"/><stop offset="1" stop-color="#34249F"/>
    </linearGradient>
  </defs>
  <g stroke="rgba(255,255,255,.38)" stroke-width=".7" stroke-linejoin="round">
    <path d="M20 10h24l-4 14H24z" fill="url(#gm-table)"/>
    <path d="M20 10l4 14H5z" fill="url(#gm-crown-l)"/>
    <path d="M44 10l15 14H40z" fill="url(#gm-crown-r)"/>
    <path d="M5 24h19l8 32z" fill="url(#gm-pav-l)"/>
    <path d="M24 24h16l-8 32z" fill="url(#gm-pav-c)"/>
    <path d="M40 24h19L32 56z" fill="url(#gm-pav-r)"/>
  </g>
  <path d="M20.6 10.6h22.8" stroke="#fff" stroke-opacity=".9" stroke-width="1" stroke-linecap="round"/>
</svg>
